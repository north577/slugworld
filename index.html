<script>
    const row2Images = document.querySelectorAll('#row2 img');
    const imageModal = document.getElementById('image-modal');
    const imageModalImg = imageModal.querySelector('img');

    row2Images.forEach(img => {
        img.addEventListener('click', event => {
            event.stopPropagation();
            imageModalImg.src = img.src;
            imageModal.classList.add('open');
        });
    });

    imageModal.addEventListener('click', event => {
        if (event.target === imageModal || event.target === imageModalImg) {
            imageModal.classList.remove('open');
        }
    });

    document.addEventListener('click', event => {
        if (imageModal.classList.contains('open') && !imageModal.contains(event.target)) {
            imageModal.classList.remove('open');
        }
    });
</script>
